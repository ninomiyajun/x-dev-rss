# lint・型・試験の検査（npm run check）。マージの必須条件にする設定は、GitHub のリポジトリの設定（ブランチの保護）で行う。
# アクションはコミットの SHA で固定し、版の名前をコメントに残す。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      # 依存のインストール用のスクリプトを動かさずに入れる
      - name: install（インストール用のスクリプトを動かさない）
        run: npm ci --ignore-scripts
      - name: check（lint・型・試験）
        run: npm run check
